name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TypeScript and pinned research solver
        run: |
          npm ci
          python -m pip install "z3-solver==5.1.0.0"

      - name: Test deterministic behavior, implementations, models and smoke checks
        run: npm run verify

      - name: Test reproducible reduced-round research runner
        run: npm run test:research
